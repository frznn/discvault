name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine .

      - name: Verify generated CLI assets
        run: python scripts/generate_cli_assets.py --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  changelog:
    # Every user-visible change records its CHANGELOG.md line; see scripts/check_changelog.py.
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the changelog covers the package changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "${PUSH_BEFORE//0/}" != "" ]; then
            range="$PUSH_BEFORE..HEAD"
          else
            echo "No base commit to compare against; skipping."
            exit 0
          fi
          python scripts/check_changelog.py "$range"

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pipx

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate built artifacts
        run: python -m twine check dist/*

      - name: pipx smoke test
        run: |
          python -m pipx install --force dist/*.whl
          PIPX_BIN_DIR="$(python -m pipx environment --value PIPX_BIN_DIR)"
          "$PIPX_BIN_DIR/discvault" --version
          "$PIPX_BIN_DIR/discvault" --help > /dev/null

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
